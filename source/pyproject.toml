[project]
name = "groundwater-v6-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "datamodel-code-generator==0.35.0",
  "mypy==2.3.0",
  "packaging==26.3",
  "PyYAML==6.0.3",
  "pytest==8.4.2",
  "ruff==0.15.16",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "kernel",
  "packages/embedding-client",
  "packages/groundwater-api-client",
  "packages/protocol-contracts",
  "packages/workflow-compiler",
  "platform/assembler",
  "services/data",
  "services/data/client",
  "services/executor",
  "services/executor/client",
  "services/knowledge-next",
  "services/knowledge-next/client",
]
exclude = ["environments/*"]

[tool.uv.sources]
groundwater-api-client = { workspace = true }
platform-assembler = { workspace = true }
platform-data-client = { workspace = true }
platform-data-service = { workspace = true }
platform-embedding-client = { workspace = true }
platform-executor-client = { workspace = true }
platform-executor-service = { workspace = true }
platform-kernel-services = { workspace = true }
platform-knowledge-client = { workspace = true }
platform-knowledge-next = { workspace = true }
platform-protocol-contracts = { workspace = true }
platform-workflow-compiler = { workspace = true }
