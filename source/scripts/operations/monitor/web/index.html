<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Groundwater V6 · 实时监控</title>
  <link rel="stylesheet" href="/monitor.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>实时监控 <span>Groundwater V6</span></h1>
      <div class="header-actions">
        <span id="connection" role="status" hidden></span>
        <span id="access-mode" hidden>局域网只读</span>
        <button id="logout" hidden>退出登录</button>
      </div>
    </div>
  </header>
  <main>
    <form id="login" hidden>
      <h2>管理员登录</h2>
      <label>账号<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
      <output id="login-error" role="alert"></output>
    </form>
    <div id="startup">
      <p id="startup-status" role="status">正在连接监控…</p>
      <p>如果页面没有继续加载，请在浏览器的新标签页中打开。<a href="/" target="_blank" rel="noopener">打开实时监控</a></p>
      <p><a href="/api/logs?limit=30">查看最近 30 条日志的原始数据</a></p>
    </div>
    <div id="workspace" hidden>
      <dl id="signals" aria-label="服务概况">
        <div><dt>网关</dt><dd id="gateway-status">未知</dd></div>
        <div><dt>Kernel 调度</dt><dd id="kernel-status">未知</dd></div>
        <div><dt>需求判断队列</dt><dd id="routing-status">未知</dd></div>
        <div><dt>队列最久等待</dt><dd id="oldest-wait">未知</dd></div>
      </dl>
      <p id="status-warning" role="status" hidden></p>
      <section class="logs-panel" aria-labelledby="logs-title">
        <div class="section-top">
          <h2 id="logs-title">实时日志</h2>
          <small>保留最近 24 小时</small>
        </div>
        <form id="filters" role="search" aria-label="日志搜索">
          <label class="search">搜索日志<input name="q" maxlength="200" type="search" placeholder="关键词或 ID" aria-description="支持请求 ID、会话 ID 和运行 ID"></label>
          <button class="search-submit" type="submit">查询</button>
          <details id="more-filters" class="more-filters">
            <summary>更多筛选</summary>
            <div class="filter-fields">
              <div class="filter-field">
                <label for="filter-service">服务</label>
                <select id="filter-service" name="service"><option value="">所有服务</option></select>
              </div>
              <label>开始时间<input name="start" type="datetime-local"></label>
              <label>结束时间<input name="end" type="datetime-local"></label>
              <button type="submit">应用筛选</button>
            </div>
          </details>
          <div id="applied-filters" hidden>
            <span id="filter-summary"></span>
            <button type="reset">清空筛选</button>
          </div>
        </form>
        <div class="view-options" role="group" aria-label="日志显示选项">
          <label class="alert-option"><input id="alerts-only" type="checkbox">只看错误和告警</label>
          <label><input id="show-routine" type="checkbox">显示例行日志</label>
          <label><input id="wrap" type="checkbox" checked>自动换行</label>
        </div>
        <div class="log-toolbar">
          <div class="log-feedback">
            <span id="follow-state">跟随最新日志</span>
            <span id="log-count"></span>
            <output id="copy-status" aria-live="polite"></output>
          </div>
          <div class="log-actions">
            <button id="older" hidden>加载更早日志</button>
            <button id="follow" class="follow-button">暂停跟随</button>
            <button id="copy-logs" disabled>复制当前日志</button>
          </div>
        </div>
        <p id="notice" role="status"></p>
        <div class="log-window" id="log-window" role="region" aria-label="日志记录" tabindex="0">
          <table class="log-table" role="table">
            <thead role="rowgroup"><tr role="row"><th scope="col">本地时间</th><th scope="col">服务</th><th scope="col">消息 <small>点击查看原文</small></th></tr></thead>
            <tbody id="logs" role="rowgroup"></tbody>
          </table>
          <p id="empty-logs" hidden><strong></strong><span></span></p>
        </div>
      </section>
      <details class="services-panel">
        <summary id="services-title">服务状态</summary>
        <div class="table-wrap service-list" role="region" aria-label="服务状态表" tabindex="0"><table><thead><tr><th>服务</th><th>进程</th><th>健康检查</th><th>就绪</th><th>Worker 心跳</th><th>重启次数</th><th>容器</th></tr></thead><tbody id="services"></tbody></table></div>
        <details><summary>队列、Worker 与 Provider 指标</summary><div class="table-wrap" role="region" aria-label="指标表" tabindex="0"><table><thead><tr><th>服务</th><th>指标</th><th>标签</th><th>值</th></tr></thead><tbody id="metrics"></tbody></table></div></details>
      </details>
    </div>
  </main>
  <dialog id="log-detail" aria-labelledby="log-detail-title">
    <div class="section-top">
      <h2 id="log-detail-title">日志原文</h2>
      <form method="dialog" class="log-actions">
        <button id="copy-entry" type="button">复制原文</button>
        <button autofocus>关闭</button>
      </form>
    </div>
    <p id="log-detail-meta"></p>
    <pre id="log-detail-line" tabindex="0"></pre>
    <output id="entry-copy-status" aria-live="polite"></output>
  </dialog>
  <dialog id="manual-copy" aria-label="手动复制日志">
    <form method="dialog">
      <label for="copy-text">文本已选中，请按 Ctrl+C 或 ⌘C 复制</label>
      <textarea id="copy-text" readonly rows="9"></textarea>
      <button>关闭</button>
    </form>
  </dialog>
  <script src="/monitor.js" defer></script>
</body>
</html>
