[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "groundwater-api-client"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.13.5", "platform-protocol-contracts==2.0.0"]

[project.scripts]
groundwater-tli = "groundwater_api_client.tli:main"

[tool.setuptools.packages.find]
where = ["src"]
