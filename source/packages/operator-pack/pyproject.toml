[project]
name = "platform-operator-pack"
version = "2.0.0"
description = "Static operator manifests, implementations, fixtures and subprocess entrypoint"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.25,<5", "pydantic>=2.11,<3"]

[project.optional-dependencies]
ml = ["torch==2.7.1+cpu"]
native = [
  "duckdb>=1.5.6,<2",
  "matplotlib>=3.8,<4",
  "numexpr>=2.10,<3",
  "numpy>=1.26,<2",
  "openpyxl>=3.1,<4",
  "pdfminer.six>=20260107,<20270000",
  "pyarrow>=19,<24",
  "pyogrio>=0.11,<1",
  "pyproj>=3.6,<4",
  "python-docx>=1.2,<2",
  "rasterio>=1.4,<2",
  "rasterstats>=0.20,<1",
  "scipy>=1.15,<2",
  "shapely>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "ty>=0.0.1a19,<1",
]

[project.scripts]
platform-operator-run = "moperators.runtime.task:main"
platform-operator-catalog = "moperators.catalog:main"
platform-operator-smoke = "moperators.smoke:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moperators"]
artifacts = ["catalog"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "moperators/catalog_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"
