[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-kernel-services"
version = "7.0.0"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "platform-workflow-compiler==1.0.0",
    "platform-protocol-contracts==2.0.0",
    "platform-executor-client==1.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "jsonschema==4.26.0",
    "openai-agents==0.22.3",
    "pydantic==2.13.5",
    "pyproj==3.7.2",
    "tiktoken==0.13.0",
    "uvicorn==0.32.1",
]

[tool.setuptools.packages.find]
where = ["src"]
