[pytest]
addopts = --import-mode=importlib -p no:asyncio
testpaths =
    kernel/tests
    packages/embedding-client/tests
    packages/protocol-contracts/tests
    packages/workflow-compiler/tests
    services/data/tests
    services/executor/tests
    services/knowledge-next/tests
    tests
    products/groundwater/tests
norecursedirs =
    .git
    .generated
    .pytest_cache
    .ruff_cache
    .venv
    build
    dist
    node_modules
pythonpath =
    .
    kernel/src
    packages/embedding-client/src
    packages/workflow-compiler/src
    packages/operator-pack/src
    packages/protocol-contracts/src
    packages/groundwater-api-client/src
    services/executor/src
    services/executor/client/src
    services/data/src
    services/data/client/src
    services/knowledge-next/src
    services/knowledge-next/client/src
    services/knowledge-next/tests
markers =
    service_image: requires the exact built service image and is executed by the joint container suite
