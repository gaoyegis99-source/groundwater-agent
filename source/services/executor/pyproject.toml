[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-executor-service"
version = "7.0.0"
requires-python = ">=3.12"
dependencies = [
    "platform-protocol-contracts==2.0.0",
    "platform-data-client==2.0.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "uvicorn==0.32.1",
]

[tool.setuptools.packages.find]
where = ["src"]
