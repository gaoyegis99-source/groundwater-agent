[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-knowledge-client"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.13.5", "platform-protocol-contracts==2.0.0"]

[project.scripts]
platform-knowledge-client = "platform_knowledge_client:main"

[tool.setuptools.packages.find]
where = ["src"]
