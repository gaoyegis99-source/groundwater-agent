[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"
[project]
name = "platform-data-client"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["httpx==0.28.1", "pydantic==2.13.5", "platform-protocol-contracts==2.0.0"]
[project.scripts]
platform-data-client = "platform_data_client.__main__:main"
[tool.setuptools.packages.find]
where = ["src"]
