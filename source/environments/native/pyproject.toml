[project]
name = "groundwater-v6-native-runtime"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "platform-operator-pack[native,ml]==2.0.0",
  "platform-executor-service==7.0.0",
  "torch==2.7.1+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
platform-operator-pack = { path = "../../packages/operator-pack" }
platform-executor-service = { path = "../../services/executor" }
platform-data-client = { path = "../../services/data/client" }
platform-protocol-contracts = { path = "../../packages/protocol-contracts" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
