[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwater-sustainability-demo"
version = "0.7.0"
description = "地下水水源地可持续利用综合评价 Linux 服务"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "uvicorn[standard]==0.34.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
